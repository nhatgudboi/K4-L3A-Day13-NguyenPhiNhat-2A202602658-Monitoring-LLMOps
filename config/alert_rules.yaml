alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'latency_p95 > 3000'
    duration: 5m
    type: symptom-based
    channel: slack-alerts
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'error_rate_pct > 2.0'
    duration: 5m
    type: symptom-based
    channel: slack-alerts-critical
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScoreOrRetrievalDegradation
    severity: warning
    condition: 'quality_avg < 0.75 or tool_success_rate_pct < 90'
    duration: 10m
    type: symptom-based
    channel: slack-alerts
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-3
